<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12221a">
  <title>自衛隊イベントガイド</title>
  <style>
    :root{--ink:#14221b;--muted:#667269;--paper:#f5f2e9;--card:#fffdf7;--green:#183e2b;--gold:#bc8b37;--line:#d9d5c9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.hero{padding:28px max(22px,calc((100% - 1180px)/2));background:radial-gradient(circle at 75% 30%,#365744 0,transparent 33%),#102119;color:white}.brand{font-size:13px;letter-spacing:.22em;font-weight:800}.hero h1{font-size:clamp(38px,8vw,82px);line-height:1.05;margin:54px 0 18px;max-width:800px}.hero p{font-size:clamp(16px,2vw,21px);line-height:1.8;max-width:680px;color:#e1e6df}.wrap{max-width:1180px;margin:auto;padding:26px 20px 70px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;background:#fff;padding:16px;border:1px solid var(--line);border-radius:18px;position:sticky;top:8px;z-index:5;box-shadow:0 10px 30px #15201818}.filters select,.filters input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.summary{display:flex;justify-content:space-between;gap:10px;margin:28px 2px 14px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{display:grid;grid-template-columns:112px 1fr;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:210px}.date{padding:20px 14px;background:var(--green);color:white}.date .month{font-size:14px;letter-spacing:.12em}.date .day{font-size:52px;line-height:1}.body{padding:19px}.meta{color:#a64131;font-size:14px;font-weight:800}.body h2{font-size:21px;line-height:1.45;margin:7px 0}.place{color:var(--muted);margin:0 0 12px}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:99px}.tag.access{background:#e4eee7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px}.actions a.primary{background:var(--ink);color:white}.empty{padding:60px;text-align:center;background:white;border-radius:16px;color:var(--muted)}footer{color:var(--muted);font-size:12px;line-height:1.7;margin-top:32px}@media(max-width:760px){.hero{padding-top:20px}.hero h1{margin-top:36px}.filters{grid-template-columns:1fr 1fr;position:static}.grid{grid-template-columns:1fr}.card{grid-template-columns:86px 1fr}.date .day{font-size:42px}.body{padding:16px}.body h2{font-size:18px}.summary{font-size:13px}}
  </style>
</head>
<body>
  <header class="hero"><div class="brand">JSDF EVENT GUIDE</div><h1>次の休み、<br>どこへ行く？</h1><p>首都圏から公共交通で行きやすい、陸・海・空自衛隊の一般向けイベントをひとつの場所に。</p></header>
  <main class="wrap">
    <section class="filters" aria-label="絞り込み">
      <select id="region"><option value="">すべての地域</option></select>
      <select id="branch"><option value="">陸・海・空すべて</option></select>
      <select id="access"><option value="">アクセス条件なし</option><option value="◎">◎ とても行きやすい</option><option value="○">○ 公共交通で可能</option><option value="△">△ 要交通確認</option></select>
      <input id="query" type="search" placeholder="イベント名・場所で検索">
    </section>
    <div class="summary"><span id="count">読み込み中…</span><span id="updated"></span></div>
    <section id="events" class="grid"></section>
    <footer>掲載内容は公式発表を自動整理した参考情報です。日程・応募条件・入場方法は、出発前に必ず「公式で確認」から確認してください。交通評価は目安です。</footer>
  </main>
<script>
const $=s=>document.querySelector(s);let all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fill(id,values){const el=$(id);for(const v of [...new Set(values)].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}}
function render(){const r=$('#region').value,b=$('#branch').value,a=$('#access').value,q=$('#query').value.trim().toLowerCase();const items=all.filter(e=>(!r||e.region===r)&&(!b||e.branch===b)&&(!a||e.accessRank===a)&&(!q||`${e.title} ${e.location} ${e.category}`.toLowerCase().includes(q)));$('#count').textContent=`${items.length}件のイベント`;$('#events').innerHTML=items.length?items.map(e=>{const d=new Date(e.date+'T00:00:00');return `<article class="card"><div class="date"><div class="month">${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}</div><div class="day">${String(d.getDate()).padStart(2,'0')}</div></div><div class="body"><div class="meta">${esc(e.region)} · ${esc(e.branch)}</div><h2>${esc(e.title)}</h2><p class="place">${esc(e.location)}</p><div class="tags"><span class="tag access">${esc(e.accessRank)} ${esc(e.accessNote)}</span><span class="tag">${esc(e.category)}</span>${e.application?'<span class="tag">要申込</span>':''}${e.ageRestriction?'<span class="tag">年齢制限あり</span>':''}</div>${e.applicationNote?`<p>${esc(e.applicationNote)}</p>`:''}<div class="actions"><a class="primary" href="${esc(e.officialUrl)}" target="_blank" rel="noopener">公式で確認</a><a href="${esc(e.mapUrl)}" target="_blank" rel="noopener">地図・経路</a></div></div></article>`}).join(''):'<div class="empty">条件に合うイベントはありません。</div>'}
fetch('./data.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{all=data.events;fill('#region',all.map(e=>e.region));fill('#branch',all.map(e=>e.branch));$('#updated').textContent=`更新 ${new Date(data.updatedAt).toLocaleString('ja-JP')}`;render()}).catch(()=>{$('#count').textContent='データを読み込めませんでした'});document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',render));
</script>
</body></html>
