<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#071c30">
  <title>JSDF EVENT GUIDE｜陸・海・空のイベントをまとめて探す</title>
  <style>
    :root{--ink:#101a23;--muted:#63707b;--paper:#f7f8f8;--white:#fff;--line:#dbe0e4;--navy:#063665;--land:#77831d;--sea:#07549b;--air:#58a8df;--radius:10px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100% - 1340px)/2));position:relative;z-index:10}.brand{font-size:17px;font-weight:900;letter-spacing:.16em}.nav{display:flex;align-items:center;gap:32px}.nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}.hero{min-height:410px;background:url('./assets/hero-harbor.jpg') center/cover no-repeat;display:flex;align-items:center}.hero-inner{width:1340px;max-width:100%;margin:auto;padding:42px 44px}.hero-copy{max-width:650px;color:#fff}.hero h1{margin:0;font-size:clamp(46px,5.1vw,76px);font-weight:950;line-height:1.18;letter-spacing:-.035em;text-shadow:0 3px 12px #000b}.hero p{max-width:520px;margin:22px 0 0;font-size:17px;font-weight:600;line-height:1.9;text-shadow:0 2px 8px #000c}.branch-jump{display:flex;gap:10px;margin-top:22px}.branch-jump button{min-width:104px;border:1px solid #ffffff8c;background:#fffffff0;border-radius:7px;padding:10px 16px;font:inherit;font-weight:900;cursor:pointer}.branch-jump button[data-branch="陸自"]{color:var(--land)}.branch-jump button[data-branch="海自"]{color:var(--sea)}.branch-jump button[data-branch="空自"]{color:#2587c7}.wrap{max-width:1340px;margin:auto;padding:0 28px 70px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.65fr;gap:14px;padding:22px 0 16px;background:var(--paper);position:sticky;top:0;z-index:8}.control{width:100%;min-height:48px;padding:0 14px;border:1px solid #cfd6dc;border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:14px;outline:none}.control:focus{border-color:var(--sea);box-shadow:0 0 0 3px #07549b1c}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 2px 16px;color:var(--muted);font-size:13px}.summary strong{color:var(--ink);font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{--branch:var(--land);background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:grid;grid-template-columns:44% 56%;min-height:290px}.card[data-branch="海自"]{--branch:var(--sea)}.card[data-branch="空自"]{--branch:var(--air)}.media{position:relative;min-height:270px;background:#dfe6ea;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}.card:hover .media img{transform:scale(1.025)}.image-note{position:absolute;right:8px;bottom:8px;background:#101820c9;color:white;border-radius:4px;padding:4px 7px;font-size:10px}.branch-label{position:absolute;left:0;top:0;background:var(--branch);color:#fff;padding:8px 12px;font-size:13px;font-weight:900}.body{padding:22px;display:flex;flex-direction:column;min-width:0}.date{font-size:13px;color:var(--muted);letter-spacing:.04em}.date strong{display:block;color:var(--ink);font-size:31px;line-height:1.05;margin-top:3px}.body h2{font-size:22px;line-height:1.4;margin:14px 0 6px;overflow-wrap:anywhere}.place{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 12px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}.tag.access{background:#eef4f0}.application{font-size:12px;line-height:1.55;margin:10px 0 0;color:#8a3a29}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:18px}.actions a{color:var(--ink);text-decoration:none;border:1px solid #cfd6dc;border-radius:6px;padding:9px 12px;font-weight:800;font-size:13px}.actions a.primary{background:var(--navy);border-color:var(--navy);color:white}.empty{grid-column:1/-1;padding:70px;text-align:center;background:white;border:1px solid var(--line);border-radius:var(--radius);color:var(--muted)}.about{margin-top:42px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.8}.about h2{font-size:16px;color:var(--ink)}
    @media(min-width:1050px){.card.featured{grid-column:1/-1;grid-template-columns:55% 45%;min-height:420px}.card.featured .media{min-height:420px}.card.featured .body{padding:30px}.card.featured .body h2{font-size:30px}.card.featured .date strong{font-size:38px}}
    @media(max-width:820px){.topbar{height:56px;padding:0 18px}.brand{font-size:13px}.nav{gap:16px}.nav a{font-size:12px}.hero{min-height:470px;background-position:60% center}.hero-inner{padding:34px 22px}.hero-copy{max-width:510px}.hero h1{font-size:clamp(40px,10vw,62px)}.hero p{font-size:15px;max-width:430px}.filters{grid-template-columns:1fr 1fr;position:static}.grid{grid-template-columns:1fr}.card{grid-template-columns:42% 58%}.summary{font-size:11px}}
    @media(max-width:560px){.topbar{height:54px}.nav a:first-child{display:none}.hero{min-height:520px;background-position:68% center;align-items:flex-end}.hero-inner{padding:36px 18px}.hero-copy{max-width:none}.hero h1{font-size:43px;line-height:1.18}.hero p{font-size:13px;line-height:1.75;max-width:340px}.branch-jump{gap:7px}.branch-jump button{min-width:0;flex:1;padding:9px}.wrap{padding:0 14px 50px}.filters{gap:8px;padding-top:14px}.control{font-size:13px;padding:0 10px}.summary{align-items:flex-start;flex-direction:column;padding:4px 2px 12px}.card{display:block;min-height:0}.media{height:210px;min-height:0}.body{padding:17px}.body h2{font-size:20px}.date strong{font-size:27px}.actions{margin-top:14px}.actions a{flex:1;text-align:center}.empty{padding:45px 16px}}
    body{overflow-x:hidden}.hero-copy{width:780px;max-width:68%;min-width:0}.hero h1{font-size:clamp(46px,4.6vw,66px)}
    @media(max-width:820px){.hero-copy{width:620px;max-width:72%}.hero h1{font-size:clamp(40px,7.1vw,58px)}}
    @media(max-width:560px){.nav{display:none}.hero-copy{width:100%;max-width:100%}.hero h1{font-size:40px;line-height:1.2;overflow-wrap:anywhere}}
    /* Selected concept fidelity: stronger hero and image-led event windows */
    .hero{position:relative;isolation:isolate}.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(2,15,29,.96) 0%,rgba(3,25,46,.82) 31%,rgba(3,25,46,.38) 57%,rgba(3,25,46,.04) 78%)}.hero h1{font-family:"Hiragino Kaku Gothic StdN","Hiragino Sans","Yu Gothic",sans-serif;font-weight:900;-webkit-text-stroke:1.25px currentColor;text-shadow:0 4px 13px #000,0 1px 0 #000;letter-spacing:-.045em}.hero p{font-weight:700}.branch-jump{display:none}
    @media(min-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:240px;grid-auto-flow:dense}.card,.card.featured{position:relative;display:block;min-height:240px;grid-template-columns:none;color:#fff;border:0;border-radius:8px;box-shadow:0 8px 22px #12202c20}.card.featured{grid-column:span 2;grid-row:span 2;min-height:498px}.card .media,.card.featured .media{position:absolute;inset:0;height:auto;min-height:0}.card .media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,20,39,.08) 18%,rgba(3,24,45,.42) 49%,rgba(2,18,35,.96) 100%)}.card.featured .media::after{background:linear-gradient(90deg,rgba(2,25,50,.95) 0%,rgba(3,37,70,.73) 48%,rgba(3,29,54,.12) 82%),linear-gradient(0deg,rgba(2,18,35,.82),transparent 56%)}.card .body,.card.featured .body{position:relative;z-index:2;height:100%;padding:18px;display:flex;justify-content:flex-end;color:#fff;text-shadow:0 2px 6px #000b}.card.featured .body{width:62%;padding:34px}.card .date,.card .place,.card.featured .date,.card.featured .place{color:#f2f6f9}.card .date strong{color:#fff;font-size:27px}.card.featured .date strong{font-size:42px}.card .body h2{font-size:18px;line-height:1.35;margin:9px 0 5px}.card.featured .body h2{font-size:31px}.card .place{font-size:12px;margin-bottom:8px}.card .tag{color:#fff;background:#0a2b49a8;border-color:#ffffff5c}.card .tag.access{background:#ffffff22}.card .application{color:#ffe3d8}.card .actions{padding-top:10px}.card .actions a{padding:7px 9px;color:#fff;background:#092d50c7;border-color:#ffffff72;font-size:11px;text-shadow:none}.card .actions a.primary{background:#fff;color:#102336;border-color:#fff}.card .branch-label{z-index:4}.card .image-note{z-index:4}.card:not(.featured) .image-note{font-size:9px}.card:not(.featured) .tags{max-height:29px;overflow:hidden}}
    @media(min-width:561px) and (max-width:1049px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{position:relative;display:block;min-height:330px;color:#fff;border:0}.card .media{position:absolute;inset:0;height:auto;min-height:0}.card .media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(2,18,35,.94) 100%)}.card .body{position:relative;z-index:2;height:100%;justify-content:flex-end;color:#fff}.card .date,.card .place,.card .date strong{color:#fff}.card .tag{color:#fff;background:#082743b8}.card .actions a{color:#fff;background:#092d50d9}.card .actions a.primary{background:#fff;color:#102336}.card .branch-label,.card .image-note{z-index:4}}
    @media(max-width:560px){.hero::before{background:linear-gradient(180deg,rgba(2,16,31,.25) 0%,rgba(2,19,37,.72) 56%,rgba(2,17,33,.94) 100%)}.hero h1{-webkit-text-stroke:.8px currentColor}.card{position:relative;display:block;min-height:390px;color:#fff;border:0}.card .media{position:absolute;inset:0;height:auto;min-height:0}.card .media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,18,35,.04) 15%,rgba(2,18,35,.93) 76%)}.card .body{position:relative;z-index:2;min-height:390px;justify-content:flex-end;color:#fff;text-shadow:0 2px 5px #000c}.card .date,.card .place,.card .date strong{color:#fff}.card .tag{color:#fff;background:#082743c2;border-color:#ffffff66}.card .actions a{color:#fff;background:#092d50db;border-color:#ffffff70}.card .actions a.primary{background:#fff;color:#102336}.card .branch-label,.card .image-note{z-index:4}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">JSDF EVENT GUIDE</div><nav class="nav"><a href="#events">イベント一覧</a><a href="#about">このサイトについて</a></nav></header>
  <section class="hero"><div class="hero-inner"><div class="hero-copy"><h1>陸・海・空のイベントを、<br>まとめて探す。</h1><p>首都圏から公共交通で行きやすい、<br>陸・海・空自衛隊の一般向けイベントを<br>ひとつの場所に。</p></div></div></section>
  <main class="wrap" id="events">
    <section class="filters" aria-label="イベントの絞り込み"><select class="control" id="region"><option value="">すべての地域</option></select><select class="control" id="branch"><option value="">陸・海・空すべて</option><option value="陸自">陸上自衛隊</option><option value="海自">海上自衛隊</option><option value="空自">航空自衛隊</option><option value="地方協力本部">地方協力本部</option><option value="その他">その他</option></select><select class="control" id="access"><option value="">アクセス条件なし</option><option value="◎">◎ とても行きやすい</option><option value="○">○ 公共交通で可能</option><option value="△">△ 要交通確認</option></select><input class="control" id="query" type="search" placeholder="イベント名・場所で検索"></section>
    <div class="summary"><strong id="count">読み込み中…</strong><span id="updated"></span></div>
    <section id="eventGrid" class="grid"></section>
    <section class="about" id="about"><h2>このサイトについて</h2><p>掲載内容は公式発表を自動整理した参考情報です。日程・応募条件・入場方法は、出発前に必ず「公式で確認」から確認してください。交通評価は目安です。「イメージ」と表示した写真はイベント分類を示すための参考画像で、当日の展示内容を保証するものではありません。</p></section>
  </main>
<script>
const $=s=>document.querySelector(s);let all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fallback=e=>e.branch==='空自'?'./assets/event-air.jpg':e.branch==='海自'?'./assets/event-sea.jpg':'./assets/event-land.jpg';
function fill(id,values){const el=$(id);for(const v of [...new Set(values)].sort()){const o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}}
function render(){const r=$('#region').value,b=$('#branch').value,a=$('#access').value,q=$('#query').value.trim().toLowerCase();const items=all.filter(e=>(!r||e.region===r)&&(!b||e.branch===b)&&(!a||e.accessRank===a)&&(!q||`${e.title} ${e.location} ${e.category}`.toLowerCase().includes(q)));$('#count').textContent=`${items.length}件のイベント`;$('#eventGrid').innerHTML=items.length?items.map((e,i)=>{const d=new Date(e.date+'T00:00:00');const image=e.imageUrl||fallback(e);return `<article class="card ${i===0?'featured':''}" data-branch="${esc(e.branch)}"><div class="media"><img src="${esc(image)}" alt="" loading="${i<2?'eager':'lazy'}" onerror="this.onerror=null;this.src='${fallback(e)}'"><span class="branch-label">${esc(e.branch)}</span>${e.imageIsIllustration?'<span class="image-note">イメージ</span>':''}</div><div class="body"><div class="date">${d.getFullYear()}年 ${d.toLocaleDateString('ja-JP',{month:'long'})}<strong>${String(d.getDate()).padStart(2,'0')} <small>${d.toLocaleDateString('ja-JP',{weekday:'short'})}</small></strong></div><h2>${esc(e.title)}</h2><p class="place">${esc(e.location)}</p><div class="tags"><span class="tag access">${esc(e.accessRank)} ${esc(e.accessNote)}</span><span class="tag">${esc(e.category)}</span>${e.application?'<span class="tag">要申込</span>':''}${e.ageRestriction?'<span class="tag">年齢制限あり</span>':''}</div>${e.applicationNote?`<p class="application">${esc(e.applicationNote)}</p>`:''}<div class="actions"><a class="primary" href="${esc(e.officialUrl)}" target="_blank" rel="noopener">公式サイトで確認</a><a href="${esc(e.mapUrl)}" target="_blank" rel="noopener">地図・経路</a></div></div></article>`}).join(''):'<div class="empty">条件に合うイベントはありません。</div>'}
fetch('./data.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{all=data.events;fill('#region',all.map(e=>e.region));$('#updated').textContent=`更新日：${new Date(data.updatedAt).toLocaleDateString('ja-JP')}`;render()}).catch(()=>{$('#count').textContent='データを読み込めませんでした'});document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',render));document.querySelectorAll('.branch-jump button').forEach(btn=>btn.addEventListener('click',()=>{$('#branch').value=btn.dataset.branch;render();document.querySelector('#events').scrollIntoView({behavior:'smooth'})}));
</script>
</body></html>
